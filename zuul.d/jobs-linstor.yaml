# LINSTOR Cinder driver job, built the way upstream builds storage jobs:
# tempest-multinode-full-py3 from openstack/tempest with this repository
# enabled as a devstack plugin. Zuul prepares cinder and os-brick at the
# speculative state of the change under test; devstack uses those
# checkouts and sets LIBS_FROM_GIT accordingly.
#
# Only the DRBD transport is tested. Two DRBD backends give the retype and
# migration tests a second backend to move volumes to.
- job:
    name: linstor-cinder-drbd
    parent: tempest-multinode-full-py3
    description: |
      Two-node devstack (controller plus compute, both running
      cinder-volume and a LINSTOR satellite) with two LINSTOR DRBD
      backends, running the tempest volume tests and the
      cinder-tempest-plugin.
    timeout: 10800
    branches: master
    # Runs after the upstream pre-run playbooks and before stack.sh.
    pre-run: playbooks/linstor/packages.yaml
    # Runs before the upstream post-run playbooks, which collect ~/logs.
    post-run: playbooks/linstor/post.yaml
    secrets:
      - name: linbit_packages
        secret: linbit_packages
    required-projects:
      - opendev.org/openstack/cinder
      - opendev.org/openstack/os-brick
      - opendev.org/openstack/cinder-tempest-plugin
      - github.com/LINBIT/linstor-openstack-ci
    vars:
      devstack_plugins:
        linstor-openstack-ci: https://github.com/LINBIT/linstor-openstack-ci
      devstack_localrc:
        # Packages come from the LINBIT repository via the pre-run playbook.
        LINSTOR_REPO: none
        LINSTOR_LOG_LEVEL: DEBUG
        # No LINSTOR_BACKING_DEVICE: the flavor has no second disk, so the
        # thin pool sits on a sparse file on the root disk.
        # Throwaway nodes: flushes cost most of the DRBD write throughput.
        LINSTOR_DRBD_FLUSHES: false
        # The in-tree driver never allows two primaries, which live migration
        # needs. Drop this once the v2 driver (review 964289) merges: it sets
        # allow-two-primaries per resource only for the migration, and the
        # group default would hide whether that works.
        LINSTOR_ALLOW_TWO_PRIMARIES: true
        CINDER_ENABLED_BACKENDS: linstordrbd:linstor-drbd-a,linstordrbd:linstor-drbd-b
        TEMPEST_VOLUME_VENDOR: LINBIT
        TEMPEST_STORAGE_PROTOCOL: DRBD
        # The driver attaches as driver_volume_type 'local', whose nova volume
        # driver cannot extend, so nova raises ExtendVolumeNotSupported.
        # Re-enable once nova can extend the connection type the driver uses.
        TEMPEST_EXTEND_ATTACHED_VOLUME: false
        # The driver has no manage_existing. Re-enable once it implements
        # manage_existing and manage_existing_get_size.
        TEMPEST_VOLUME_MANAGE_VOLUME: false
        TEMPEST_VOLUME_REVERT_TO_SNAPSHOT: true
        # A DRBD resource has one writer; multiattach tests would fail by design.
        ENABLE_VOLUME_MULTIATTACH: false
        # os-brick's encryptors replace the volume's device_path with a symlink
        # to the dm-crypt device. The driver hands out the /dev/drbdN node
        # itself, so the node is lost for every later user of that minor and
        # the satellite fails on it. Re-enable once the driver returns a
        # symlink; https://review.opendev.org/c/openstack/os-brick/+/1008416
        # makes os-brick refuse such paths instead of breaking the node.
        ATTACH_ENCRYPTED_VOLUME_AVAILABLE: false
        # Upstream defaults to qemu emulation. The CI cloud's hypervisors
        # expose vmx to the nodes, so tempest's guests run under KVM.
        LIBVIRT_TYPE: kvm
      devstack_local_conf:
        test-config:
          $TEMPEST_CONFIG:
            compute-feature-enabled:
              volume_backed_live_migration: true
      tempest_plugins:
        - cinder-tempest-plugin
      tox_envlist: all
      tempest_test_regex: (volume|cinder_tempest_plugin)
      zuul_copy_output:
        /var/log/linstor-controller: logs
        /var/log/linstor-satellite: logs
        /etc/linstor: logs
        /etc/drbd.d: logs
    group-vars:
      # Subnodes run cinder-volume too, so they need the same backends.
      subnode:
        devstack_localrc:
          LINSTOR_REPO: none
          LINSTOR_LOG_LEVEL: DEBUG
          LINSTOR_REMOTE_CONTROLLER: true
          CINDER_ENABLED_BACKENDS: linstordrbd:linstor-drbd-a,linstordrbd:linstor-drbd-b
          ENABLE_VOLUME_MULTIATTACH: false
          LIBVIRT_TYPE: kvm
