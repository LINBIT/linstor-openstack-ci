# Credentials for the public log bucket, used by the base job.
#
# Zuul accepts plain values, but anyone with read access to this repo sees
# them. Encrypt the sensitive ones with the tenant's public key for this
# project (Zuul web serves it), for example:
#
#   echo -n "$ACCESS_KEY" | zuul-client --zuul-url https://<zuul-web> \
#       encrypt --tenant linbit --project github.com/LINBIT/linstor-openstack-ci \
#       --secret-name linbit_log_s3 --field-name access_key
#
# and paste the resulting `!encrypted/pkcs1-oaep` value in place of the
# placeholder. The endpoint and bucket may stay in plain text.
- secret:
    name: linbit_log_s3
    data:
      endpoint: https://s3.example.linbit.com
      bucket: zuul-logs
      access_key: REPLACE-WITH-ENCRYPTED-VALUE
      secret_key: REPLACE-WITH-ENCRYPTED-VALUE

# LINBIT customer repository for DRBD and LINSTOR, used by
# playbooks/linstor/packages.yaml. repo_url carries the contract token and
# must be encrypted; the other two fields are public knowledge.
#   echo -n "https://packages.linbit.com/<token>/" | zuul-client ... encrypt \
#       --secret-name linbit_packages --field-name repo_url
- secret:
    name: linbit_packages
    data:
      repo_url: REPLACE-WITH-ENCRYPTED-VALUE
      component: drbd-9
      key_url: https://packages.linbit.com/package-signing-pubkey.asc
