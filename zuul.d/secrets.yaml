# Credentials for the public log bucket, used by the base job.
#
# Zuul accepts plain values, but anyone with read access to this repo sees
# them. Encrypt the sensitive ones with the tenant's public key for this
# project (Zuul web serves it), for example:
#
#   echo -n "$ACCESS_KEY" | zuul-client --zuul-url https://<zuul-web> \
#       encrypt --tenant linbit --project github.com/LINBIT/linstor-openstack-ci \
#       --secret-name linbit_log_s3 --field-name access_key
#
# and paste the resulting `!encrypted/pkcs1-oaep` value in place of the
# placeholder. The endpoint and bucket may stay in plain text.
