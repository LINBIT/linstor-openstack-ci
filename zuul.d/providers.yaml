# Where zuul-launcher gets build nodes from: throwaway VMs on the LINBIT
# CI cloud, through the linbit-openstack connection, whose clouds.yaml
# lives on the Zuul host.
#
# Label names must match what the upstream nodesets we load ask for:
# openstack-two-node-noble wants two "ubuntu-noble" nodes.
#
# Cloud prerequisites:
#   - a Noble cloud image in Glance (image-id below)
#   - a flavor with 8 vCPU and 8 GB RAM; the 80 GB root disk (OpenDev's
#     size) is a Cinder volume, and the LINSTOR thin pool lives on a
#     sparse file on it
#   - a keypair named "zuul" holding the public half of the executor's
#     node key
#   - the ci-net tenant network and the zuul-nodes security group
# The deployment playbooks create the last three along with the Zuul VM.
- image:
    name: ubuntu-noble
    type: cloud

- flavor:
    name: ci-8x8

- label:
    name: ubuntu-noble
    description: Ubuntu 24.04, 8 vCPU, 8 GB RAM, 80 GB disk. Matches OpenDev.
    image: ubuntu-noble
    flavor: ci-8x8

- section:
    name: linbit-cloud
    connection: linbit-openstack
    flavors:
      - name: ci-8x8
        flavor-name: ci-8x8

- provider:
    name: linbit-cloud-main
    section: linbit-cloud
    images:
      - name: ubuntu-noble
        image-id: acd25080-40c2-43df-98b8-616acf2555f2
        username: ubuntu
        python-path: /usr/bin/python3
    labels:
      - name: ubuntu-noble
        key-name: zuul
        # Nodes get a fixed address on the tenant network only.
        networks: [ci-net]
        auto-floating-ip: false
        security-groups: [zuul-nodes]
        # Root disks come from Cinder, not the computes' small local disks.
        # The launcher deletes each volume along with its server.
        boot-from-volume: true
        volume-size: 80
    resource-limits:
      # Two nodes per run; this allows six runs at once. The project quota
      # covers twelve, the CPU limit of the three hypervisors at 1:1. Raise
      # once node boot times and storage latency hold up under load.
      instances: 12
