# The job every other job inherits from. Adapted from zuul/zuul-base-jobs
# with log publishing added, the one thing a deployer has to supply.
- job:
    name: base
    parent: null
    abstract: true
    description: |
      Copies the prepared git repositories to every node, collects
      whatever the job leaves in ~/zuul-output on the nodes, and publishes
      the build's logs on the Zuul VM.
    pre-run: playbooks/base/pre.yaml
    post-run:
      - playbooks/base/post.yaml
      - name: playbooks/base/cleanup.yaml
        cleanup: true
      - playbooks/base/post-logs.yaml
    roles:
      - zuul: opendev.org/zuul/zuul-jobs
    timeout: 1800
    post-timeout: 1800
