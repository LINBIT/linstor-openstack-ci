- name: Write the job header and inventory into the logs
  hosts: localhost
  roles:
    - role: emit-job-header
      zuul_log_path_shard_build: true
    - log-inventory

- name: Prepare every node
  hosts: all
  roles:
    - add-build-sshkey
    - start-zuul-console
    - ensure-output-dirs
    - validate-host
    - prepare-workspace-git
  tasks:
    # Stock cloud images ship without package lists. OpenDev's images come
    # with a warm cache, so upstream jobs install packages without updating
    # first, and fail here with "No package matching ... is available".
    - name: Refresh the package lists
      become: true
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'
