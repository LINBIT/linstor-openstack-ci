# Runs on the executor, as trusted code. The executor may write to
# /var/lib/zuul/logs (trusted_rw_paths), and Caddy on the Zuul VM serves
# that directory at https://zuul.linbit.com/logs/. The role returns the
# build's URL to Zuul, which puts it in the Gerrit comment and the
# dashboard.
- name: Publish the build's logs
  hosts: localhost
  gather_facts: false
  roles:
    - generate-zuul-manifest
    - role: upload-logs
      zuul_logserver_root: /var/lib/zuul/logs
      zuul_log_url: https://zuul.linbit.com/logs
